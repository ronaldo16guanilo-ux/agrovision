server:
  port: ${PORT:8080}

spring:
  application:
    name: agrovision-spring
  datasource:
    # URL de conexión MySQL (Soporta Railway MYSQL_URL / MYSQLHOST o localhost local)
    url: ${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:agrovision_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:r1p6G12r04}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# Configuración propia de AgroVisión
agrovision:
  plantnet:
    api-key: ${PLANTNET_API_KEY:2b10i2p4nn5qaQ1k1ElhO9hKp}
    base-url: https://my-api.plantnet.org/v2
  openai:
    api-key: ${OPENAI_API_KEY:}
    vision-model: gpt-4o-mini
    agent-model: gpt-4o-mini
  confidence-threshold: 0.70
  uploads-dir: uploads
  cors:
    allowed-origins:
      - "https://chiaway.com"
      - "https://*.chiaway.com"
      - "https://*.up.railway.app"
      - "https://*.railway.app"
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://localhost:5173"
      - "http://localhost:8080"
      - "http://localhost:8085"
